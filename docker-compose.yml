services:
  postgres:
    image: postgres:16-alpine
    container_name: bdhost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bdhost
      POSTGRES_PASSWORD: bdhost
      POSTGRES_DB: bdhost
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdhost -d bdhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bdhost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bdhost-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://bdhost:bdhost@postgres:5432/bdhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run fastapi dev api/main.py --host 0.0.0.0 --port 8000

  app-runtime:
    build:
      context: .
      dockerfile: Dockerfile.app-runtime
    container_name: bdhost-app-runtime
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://bdhost:bdhost@postgres:5432/bdhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run fastapi dev app_runtime/main.py --host 0.0.0.0 --port 8001

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: bdhost-worker
    restart: unless-stopped
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://bdhost:bdhost@postgres:5432/bdhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run arq worker.main.WorkerSettings --watch worker

volumes:
  postgres_data:
  redis_data:
